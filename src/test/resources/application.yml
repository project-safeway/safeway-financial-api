spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

rabbitmq:
  exchanges:
    aluno: aluno.exchange
  queues:
    aluno-criado: financeiro.aluno.criado.queue
    aluno-atualizado: financeiro.aluno.atualizado.queue
    aluno-inativado: financeiro.aluno.inativado.queue
  routing-keys:
    aluno-criado: aluno.criado
    aluno-atualizado: aluno.atualizado
    aluno-inativado: aluno.inativado


